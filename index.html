<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フルマラソン大会ファインダー 2026-27 | エントリー日・抽選/先着で探せる大会一覧</title>
<meta name="description" content="全国の主要フルマラソン60大会（2026-27シーズン）をエントリー日・抽選/先着・受付状況で検索。受付中の大会、これからエントリー開始の大会がひと目でわかります。">
<meta property="og:title" content="フルマラソン大会ファインダー 2026-27">
<meta property="og:description" content="全国の主要フルマラソンをエントリー日・抽選/先着・受付状況で検索できる一覧サイト">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23D51F45'/%3E%3Ctext x='32' y='43' font-family='Helvetica,Arial' font-size='28' font-weight='bold' fill='white' text-anchor='middle'%3E42%3C/text%3E%3C/svg%3E">
<style>
:root{
  --crimson:#D51F45; --orange:#EF7D00; --gold:#F7B000;
  --ink:#1A1A1A; --gray:#6E6E6E; --gray2:#9C9C98;
  --bargray:#D9D9D9; --tint:#FCEEEC; --tint2:#FBE7E3;
  --line:#E3E0DA; --white:#FFFFFF;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Helvetica Neue","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Meiryo",sans-serif;
  font-feature-settings:"palt" 1,"kern" 1;
  color:var(--ink); background:var(--white);
  line-height:1.75; letter-spacing:0.04em; word-break:keep-all; overflow-wrap:anywhere;
}
.topbar{height:4px;background:linear-gradient(90deg,var(--crimson),var(--orange))}
.wrap{max-width:1240px;margin:0 auto;padding:0 28px}
header{padding:36px 0 8px}
.kicker{font-size:11px;font-weight:700;letter-spacing:0.18em;color:var(--gray2);text-transform:uppercase}
h1{font-size:30px;font-weight:700;line-height:1.4;margin-top:4px}
h1 .accent{color:var(--crimson)}
.lede{font-size:13px;color:var(--gray);margin-top:6px}
/* サマリー */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0 18px}
.stat{border:1px solid var(--line);border-radius:10px;padding:14px 18px;background:var(--white)}
.stat .num{font-size:26px;font-weight:700;line-height:1.3}
.stat .num.hot{color:var(--crimson)}
.stat .num.soon{color:var(--orange)}
.stat .label{font-size:12px;color:var(--gray);margin-top:2px}
/* 検索パネル */
.searchpanel{border:1px solid var(--line);border-radius:10px;background:var(--white);padding:20px 22px;margin-bottom:18px}
input[type=search]{
  width:100%;border:1px solid var(--line);border-radius:999px;
  padding:9px 18px;font-size:14px;font-family:inherit;color:var(--ink);outline:none;
}
input[type=search]:focus{border-color:var(--crimson)}
.chiprows{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chiprow .rowlabel{font-size:11px;font-weight:700;color:var(--gray2);letter-spacing:0.1em;min-width:64px}
.chip{
  border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:12px;
  color:var(--gray);background:var(--white);cursor:pointer;font-family:inherit;letter-spacing:0.04em;
  min-height:28px;
}
.chip .cnt{font-size:11px;color:var(--gray2);margin-left:4px}
.chip:hover{background:var(--tint2)}
.chip.on{background:var(--tint);border-color:var(--crimson);color:var(--crimson);font-weight:700}
.chip.on .cnt{color:var(--crimson)}
/* 結果ヘッダー */
.resulthead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:0 0 12px}
.resulthead h2{font-size:14px;font-weight:700;flex:1;min-width:150px}
select{
  border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;
  font-family:inherit;color:var(--ink);background:var(--white);outline:none;
}
.rescount{font-size:13px;color:var(--gray);white-space:nowrap}
.rescount b{font-family:"Helvetica Neue",sans-serif;font-size:19px;font-weight:700;color:var(--crimson);margin-right:1px}
/* 結果リスト: 単一コンテナ＋区切り線 */
.results{border:1px solid var(--line);border-radius:10px;background:var(--white);margin-bottom:48px;overflow:hidden}
.row{display:flex;gap:18px;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row:hover{background:var(--tint)}
/* 日付タイル */
.dtile{
  width:80px;flex-shrink:0;border:1px solid var(--line);border-radius:8px;background:var(--white);
  display:flex;flex-direction:column;align-items:center;padding:8px 4px 6px;line-height:1.35;
}
.dt-m{font-size:11px;font-weight:700;letter-spacing:0.08em;color:var(--gray2)}
.dt-d{font-family:"Helvetica Neue",sans-serif;font-size:24px;font-weight:700;color:var(--ink)}
.dt-d.tbd{font-size:13px;color:var(--gray2);padding:6px 0}
.dt-w{font-size:11px;color:var(--gray)}
.dt-w.red{color:var(--crimson);font-weight:700}
.row .main{flex:1;min-width:0}
.titleline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rname{font-size:16px;font-weight:700;line-height:1.5}
.badge{border-radius:999px;padding:2px 12px;font-size:11px;font-weight:700;white-space:nowrap}
.badge.open{background:var(--crimson);color:var(--white)}
.badge.before{background:var(--orange);color:var(--white)}
.badge.closed{background:var(--bargray);color:var(--gray)}
.badge.soldout{border:1px solid var(--bargray);color:var(--gray);background:var(--white)}
.badge.tba{border:1px solid var(--line);color:var(--gray2);background:var(--white)}
.pill{border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:11px;font-weight:700;color:var(--ink);white-space:nowrap}
.meta{font-size:13px;color:var(--gray);margin-top:5px;display:flex;flex-wrap:wrap;column-gap:16px;row-gap:2px}
.meta b{color:var(--ink);font-weight:700}
.meta .prev{color:var(--gray2)}
.deadline{color:var(--crimson);font-weight:700}
.tagline{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.tag{background:var(--tint2);border-radius:999px;padding:1px 10px;font-size:11px;color:var(--ink)}
.tag.outline{background:var(--white);border:1px solid var(--line);color:var(--gray)}
.note{font-size:11px;color:var(--gray2);margin-left:4px}
.side{width:170px;flex-shrink:0;text-align:right;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.pop{font-size:13px;letter-spacing:0.2em;color:var(--gold);white-space:nowrap}
.pop .off{color:var(--line)}
.pop .poplabel{font-size:11px;color:var(--gray2);letter-spacing:0.04em;margin-right:4px}
.cap{font-size:12px;color:var(--gray)}
.links{font-size:12px;margin-top:2px}
.links a{color:var(--orange);font-weight:700;text-decoration:none;padding:4px 0}
.links a:hover{text-decoration:underline}
.links a.sub{color:var(--gray2);font-weight:400;margin-left:10px}
.myrow{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.mychip{border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11px;color:var(--gray);background:var(--white);cursor:pointer;font-family:inherit;letter-spacing:0.04em}
.mychip:hover{background:var(--tint2)}
.mychip.on{background:var(--tint);border-color:var(--crimson);color:var(--crimson);font-weight:700}
.empty{padding:60px 0;text-align:center;color:var(--gray2);font-size:14px}
footer{border-top:1px solid var(--line);padding:20px 0 40px;font-size:11px;color:var(--gray2);line-height:1.9}
footer a{color:var(--gray2)}
@media(max-width:768px){
  .wrap{padding:0 16px}
  h1{font-size:24px}
  .stats{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat{padding:12px 14px}
  .stat .num{font-size:22px}
  .stat .label{word-break:normal;line-height:1.5}
  .searchpanel{padding:16px}
  .chiprow{align-items:flex-start}
  .chiprow .rowlabel{padding-top:5px}
  .resulthead h2{flex-basis:100%}
  .row{flex-direction:column;gap:8px;padding:16px}
  .dtile{width:auto;flex-direction:row;gap:3px;padding:2px 10px;align-items:baseline;border:none;background:var(--tint2);border-radius:999px}
  .dt-d{font-size:15px}
  .dt-d.tbd{padding:0;font-size:12px}
  .side{width:100%;flex-direction:row;justify-content:space-between;align-items:center;text-align:left;flex-wrap:wrap;row-gap:8px}
}
@media(max-width:420px){
  .rescount .total{display:none}
}
</style>
</head>

<div class="topbar"></div>
<div class="wrap">
<header>
  <p class="kicker">FULL MARATHON RACE FINDER</p>
  <h1>フルマラソン<span class="accent">大会ファインダー</span></h1>

<script>
const DATA = JSON.parse(document.getElementById('race-data').textContent);
const HOLIDAYS = {
  "2026-08-11":1,"2026-09-21":1,"2026-09-23":1,"2026-10-12":1,"2026-11-03":1,
  "2026-11-23":1,"2027-01-01":1,"2027-01-11":1,"2027-02-11":1,"2027-02-23":1,
  "2027-03-21":1,"2027-03-22":1
};
const WD = ["日","月","火","水","木","金","土"];
const today = new Date(); today.setHours(0,0,0,0);

function d(iso){ if(!iso) return null; const [y,m,dd]=iso.split("-").map(Number); return new Date(y,m-1,dd); }
function isRedDay(iso){ const dt=d(iso); return dt && (dt.getDay()===0 || dt.getDay()===6 || HOLIDAYS[iso]); }
function wdLabel(iso){
  const dt = d(iso); if(!dt) return "";
  const w = WD[dt.getDay()];
  if(HOLIDAYS[iso] && dt.getDay()!==0 && dt.getDay()!==6) return `(${w}・祝)`;
  return `(${w})`;
}
function fmtFull(iso){ const dt=d(iso); return dt?`${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日${wdLabel(iso)}`:""; }
function fmtShort(iso){ const dt=d(iso); return dt?`${dt.getFullYear()}/${dt.getMonth()+1}/${dt.getDate()}${wdLabel(iso)}`:""; }
function daysUntil(iso){ return Math.round((d(iso)-today)/86400000); }

function status(r){
  if(r.canceled) return {key:"closed", cls:"closed", label:"次回休止"};
  if(!r.entry_announced) return {key:"tba", cls:"tba", label:"未発表"};
  if(r.closed_early) return {key:"closed", cls:"soldout", label:"定員締切"};
  const s = d(r.entry_start);
  if(today < s){
    const n = daysUntil(r.entry_start);
    return {key:"before", cls:"before", label: n<=14?`開始前・あと${n}日`:"開始前"};
  }
  if(r.entry_end && today > d(r.entry_end)) return {key:"closed", cls:"closed", label:"受付終了"};
  return {key:"open", cls:"open", label:"エントリー受付中"};
}

// マイリスト（この端末のブラウザにのみ保存）
const MY_CATS = [{key:"kiroku",label:"記録"},{key:"fun",label:"楽しむ"},{key:"oinori",label:"お祈り"}];
let myRaces = {};
try{ myRaces = JSON.parse(localStorage.getItem("mrf_myraces")||"{}"); }catch(e){}
function setMy(name, key){
  if(myRaces[name]===key) delete myRaces[name]; else myRaces[name]=key;
  try{ localStorage.setItem("mrf_myraces", JSON.stringify(myRaces)); }catch(e){}
  render();
}

const FILTERS = [
  {id:"status", label:"状況", opts:["受付中","開始前","未発表","終了"],
   test:(r,v)=>({"受付中":"open","開始前":"before","未発表":"tba","終了":"closed"}[v])===status(r).key},
  {id:"method", label:"方式", opts:["抽選","先着"],
   test:(r,v)=>(r.entry_method||"").includes(v)},
  {id:"month", label:"開催月", opts:["8月","9月","10月","11月","12月","1月","2月","3月"],
   test:(r,v)=>(r.sort_date||r.race_date) && (d(r.sort_date||r.race_date).getMonth()+1)+"月"===v},
  {id:"region", label:"地方", opts:["北海道","東北","関東","北陸・甲信越","東海","関西","中国","四国","九州・沖縄"],
   test:(r,v)=>r.region===v},
  {id:"feature", label:"特徴", opts:["記録狙い","ファンラン","両方"],
   test:(r,v)=>r.feature===v},
  {id:"my", label:"マイリスト", opts:["記録","楽しむ","お祈り"],
   test:(r,v)=>myRaces[r.name]===({"記録":"kiroku","楽しむ":"fun","お祈り":"oinori"}[v])},
];
const active = {};
FILTERS.forEach(f=>active[f.id]=new Set());

function matchesSearch(r){
  const q = document.getElementById("q").value.trim();
  return !q || (r.name+r.location+(r.notes||"")).includes(q);
}
function passes(r, exceptId){
  if(!matchesSearch(r)) return false;
  for(const f of FILTERS){
    if(f.id===exceptId) continue;
    if(active[f.id].size && ![...active[f.id]].some(v=>f.test(r,v))) return false;
  }
  return true;
}
function optionCount(f, v){
  return DATA.races.filter(r=>passes(r, f.id) && f.test(r,v)).length;
}

function buildChips(){
  const box = document.getElementById("chiprows");
  box.innerHTML = "";
  for(const f of FILTERS){
    const row = document.createElement("div"); row.className="chiprow";
    row.innerHTML = `<span class="rowlabel">${f.label}</span>`;
    for(const o of f.opts){
      const b = document.createElement("button");
      b.className = "chip" + (active[f.id].has(o)?" on":"");
      b.innerHTML = `${o}<span class="cnt">${optionCount(f,o)}</span>`;
      b.onclick = ()=>{ active[f.id].has(o)?active[f.id].delete(o):active[f.id].add(o); render(); };
      row.appendChild(b);
    }
    if(f.id==="my"){
      const n = document.createElement("span");
      n.className = "note"; n.textContent = "この端末のブラウザにのみ保存";
      row.appendChild(n);
    }
    box.appendChild(row);
  }
}

function filtered(){
  let rs = DATA.races.filter(r=>passes(r, null));
  const mode = document.getElementById("sort").value;
  const sd = r=>r.sort_date||r.race_date||"9999";
  const ed = r=>r.entry_sort_date||r.entry_start||"9999";
  if(mode==="entry") rs.sort((a,b)=>ed(a).localeCompare(ed(b)));
  else if(mode==="pop") rs.sort((a,b)=>(b.popularity-a.popularity)||sd(a).localeCompare(sd(b)));
  else rs.sort((a,b)=>sd(a).localeCompare(sd(b)));
  return rs;
}

function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function dtile(r){
  if(r.race_announced && r.race_date){
    const dt = d(r.race_date);
    const w = wdLabel(r.race_date);
    return `<div class="dtile"><span class="dt-m">${dt.getMonth()+1}月</span><span class="dt-d">${dt.getDate()}</span><span class="dt-w${isRedDay(r.race_date)?" red":""}">${w}</span></div>`;
  }
  const base = r.sort_date||r.race_date;
  const m = base ? (d(base).getMonth()+1)+"月" : "—";
  return `<div class="dtile"><span class="dt-m">${m}</span><span class="dt-d tbd">未定</span></div>`;
}

function rowHtml(r){
  const st = status(r);
  const badge = `<span class="badge ${st.cls}">${st.label}</span>`;
  const method = r.entry_method && r.entry_method!=="不明" ? `<span class="pill">${esc(r.entry_method)}</span>` : "";

  let dateHtml = r.race_announced
    ? `<span>開催 <b>${fmtFull(r.race_date)}</b>${r.race_date_note?`<span class="note">${esc(r.race_date_note)}</span>`:""}</span>`
    : `<span class="prev">前回開催 ${fmtShort(r.race_date)}（新日程 未発表）</span>`;

  let entryHtml = "";
  if(r.entry_announced){
    let e = `エントリー <b>${fmtShort(r.entry_start)}</b>`;
    if(r.entry_end) e += ` 〜 ${fmtShort(r.entry_end)}`;
    if(st.key==="before" && daysUntil(r.entry_start)<=14) e = `<span class="deadline">${e}</span>`;
    entryHtml = `<span>${e}</span>`;
  }else{
    entryHtml = `<span class="prev">前回エントリー開始 ${r.entry_start?fmtShort(r.entry_start):"—"}${r.entry_note?`・${esc(r.entry_note)}`:""}</span>`;
  }

  const lim = r.time_limit ? `<span>制限 ${esc(r.time_limit)}</span>` : "";
  const types = (r.race_types||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("");
  const feat = r.feature && !(r.race_types||[]).includes(r.feature) ? `<span class="tag outline">${esc(r.feature)}</span>` : "";
  const course = r.course_profile && r.course_profile!=="不明" ? `<span class="tag outline">${esc(r.course_profile)}</span>` : "";
  const notes = r.notes ? `<span class="note">${esc(r.notes)}</span>` : "";
  const pop = `<span class="pop"><span class="poplabel">人気</span>${"●".repeat(r.popularity)}<span class="off">${"●".repeat(3-r.popularity)}</span></span>`;
  const cap = r.capacity_full ? `<span class="cap">定員 ${r.capacity_full.toLocaleString()}人</span>` : "";
  const links = `<span class="links">${r.official_url?`<a href="${esc(r.official_url)}" target="_blank" rel="noopener">公式サイト</a>`:""}${r.runnet_url?`<a class="sub" href="${esc(r.runnet_url)}" target="_blank" rel="noopener">RUNNET</a>`:""}</span>`;

  const myrow = `<span class="myrow">${MY_CATS.map(c=>
    `<button class="mychip${myRaces[r.name]===c.key?" on":""}" data-name="${esc(r.name)}" data-cat="${c.key}">${c.label}</button>`
  ).join("")}</span>`;

  return `<div class="row">
    ${dtile(r)}
    <div class="main">
      <div class="titleline">${badge}<span class="rname">${esc(r.name)}</span>${method}</div>
      <div class="meta"><span>${esc(r.location)}</span>${dateHtml}${lim}</div>
      <div class="meta">${entryHtml}</div>
      <div class="tagline">${types}${feat}${course}${notes}</div>
    </div>
    <div class="side">${myrow}${pop}${cap}${links}</div>
  </div>`;
}

function render(){
  const rs = filtered();
  document.getElementById("list").innerHTML =
    rs.length ? rs.map(rowHtml).join("") : `<div class="empty">条件に合う大会がありません</div>`;
  document.getElementById("count").innerHTML = `検索結果 <b>${rs.length}</b>件<span class="total"> / 全${DATA.races.length}大会</span>`;
  buildChips();

  const all = DATA.races;
  const nOpen = all.filter(r=>status(r).key==="open").length;
  const nSoon = all.filter(r=>{const s=status(r);return s.key==="before"&&daysUntil(r.entry_start)<=14;}).length;
  const nTba = all.filter(r=>status(r).key==="tba").length;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="num hot">${nOpen}</div><div class="label">エントリー受付中</div></div>
    <div class="stat"><div class="num soon">${nSoon}</div><div class="label">14日以内にエントリー開始</div></div>
    <div class="stat"><div class="num">${nTba}</div><div class="label">新日程 未発表</div></div>
    <div class="stat"><div class="num">${all.length}</div><div class="label">掲載大会</div></div>`;
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("sort").addEventListener("change", render);
document.getElementById("list").addEventListener("click", e=>{
  const b = e.target.closest(".mychip");
  if(b) setMy(b.dataset.name, b.dataset.cat);
});
render();
</script>
</body>
</html>
